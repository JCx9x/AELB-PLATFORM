name: Deploy PRE (manual)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing PRE tag to redeploy; leave empty to build this commit"
        required: false
        type: string

concurrency:
  group: aelb-pre-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-south-2
  ECR_REGISTRY: 537735703239.dkr.ecr.eu-south-2.amazonaws.com
  INSTANCE_ID: i-073035077dc228e14
  PRE_URL: http://ec2-35-43-130-103.eu-south-2.compute.amazonaws.com
  DOMAIN_NAME: ec2-35-43-130-103.eu-south-2.compute.amazonaws.com
  FILES_BUCKET: aelb-pre-files-537735703239-eu-south-2
  BACKUPS_BUCKET: aelb-pre-backups-537735703239-eu-south-2
  AELB_PARAMETER_PREFIX: /aelb/pre/
  CORS_ALLOWED_ORIGINS: http://ec2-35-43-130-103.eu-south-2.compute.amazonaws.com
  FRONTEND_PUBLIC_URL: http://ec2-35-43-130-103.eu-south-2.compute.amazonaws.com
  STRIPE_SUCCESS_URL: http://ec2-35-43-130-103.eu-south-2.compute.amazonaws.com/perfil?stripe=success&session_id={CHECKOUT_SESSION_ID}
  STRIPE_CANCEL_URL: http://ec2-35-43-130-103.eu-south-2.compute.amazonaws.com/perfil?stripe=cancelled
  STRIPE_WEBHOOK_ENABLED: "false"
  EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED || 'false' }}
  EMAIL_WORKER_ENABLED: ${{ vars.EMAIL_WORKER_ENABLED || 'false' }}
  EMAIL_PROVIDER: ses
  EMAIL_FROM: javiercanoramirez@gmail.com
  EMAIL_FROM_NAME: AELB PRE
  EMAIL_SES_REGION: eu-south-1
  APP_VERSION: pre

jobs:
  deploy:
    name: Build and deploy PRE
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: pre
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

    steps:
      - name: Checkout selected branch/commit
        uses: actions/checkout@v4.2.2

      - name: Check deployment configuration
        run: |
          set -Eeuo pipefail
          [[ -n "$AWS_ROLE_ARN" ]] || {
            echo 'Missing GitHub Environment variable AWS_DEPLOY_ROLE_ARN' >&2
            exit 1
          }
          echo "Deploying commit $GITHUB_SHA"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.3.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Select image tag
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          set -Eeuo pipefail
          tag="${REQUESTED_TAG:-pre-${GITHUB_SHA}}"
          [[ "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || {
            echo 'Invalid image tag' >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"
          echo "BACKEND_IMAGE=$ECR_REGISTRY/aelb-pre-backend:$tag" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=$ECR_REGISTRY/aelb-pre-frontend:$tag" >> "$GITHUB_ENV"
          echo "Using image tag: $tag"

      - name: Prepare ARM64 emulation
        if: ${{ inputs.image_tag == '' }}
        uses: docker/setup-qemu-action@v3.6.0

      - name: Prepare Docker Buildx
        if: ${{ inputs.image_tag == '' }}
        uses: docker/setup-buildx-action@v3.11.1

      - name: Build and push ARM64 images
        if: ${{ inputs.image_tag == '' }}
        env:
          DOCKER_CACHE_FROM: gha
          DOCKER_CACHE_TO: gha
        run: ./scripts/build-pre.sh

      - name: Sync runtime and deploy through SSM
        id: deploy
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          wait_for_ssm() {
            local command_id="$1"
            local status='Pending'
            for _ in $(seq 1 60); do
              status="$(aws ssm get-command-invocation \
                --region "$AWS_REGION" --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
              case "$status" in
                Success) return 0 ;;
                Failed|Cancelled|TimedOut|Cancelling)
                  aws ssm get-command-invocation --region "$AWS_REGION" \
                    --command-id "$command_id" --instance-id "$INSTANCE_ID" \
                    --query '{stdout:StandardOutputContent,stderr:StandardErrorContent}' \
                    --output yaml >&2 || true
                  return 1 ;;
              esac
              sleep 5
            done
            echo "Timed out waiting for SSM command $command_id" >&2
            return 1
          }

          sync_id="$(./scripts/sync-pre-runtime.sh)"
          echo "Runtime sync: $sync_id"
          wait_for_ssm "$sync_id"

          deploy_id="$(aws ssm send-command --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "AELB PRE simple deploy ${GITHUB_SHA}" \
            --parameters 'commands=["/opt/aelb/deploy-pre.sh"]' \
            --query Command.CommandId --output text)"
          echo "Deployment: $deploy_id"
          wait_for_ssm "$deploy_id"
          aws ssm get-command-invocation --region "$AWS_REGION" \
            --command-id "$deploy_id" --instance-id "$INSTANCE_ID" \
            --query '{stdout:StandardOutputContent,stderr:StandardErrorContent}' \
            --output yaml

      - name: Verify PRE
        run: |
          set -Eeuo pipefail
          check_id="$(aws ssm send-command --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "AELB PRE simple health ${GITHUB_SHA}" \
            --parameters 'commands=["docker ps --all --filter name=aelb-pre","mountpoint -q /var/lib/aelb/mysql"]' \
            --query Command.CommandId --output text)"
          for _ in $(seq 1 36); do
            status="$(aws ssm get-command-invocation --region "$AWS_REGION" \
              --command-id "$check_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success) break ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation --region "$AWS_REGION" \
                  --command-id "$check_id" --instance-id "$INSTANCE_ID" \
                  --query '{stdout:StandardOutputContent,stderr:StandardErrorContent}' \
                  --output yaml >&2 || true
                exit 1 ;;
            esac
            sleep 5
          done
          [[ "$status" == Success ]] || exit 1
          aws ssm get-command-invocation --region "$AWS_REGION" \
            --command-id "$check_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            --retry-connrefused --max-time 15 "$PRE_URL/" >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            --retry-connrefused --max-time 15 "$PRE_URL/api/championships" >/dev/null
          echo "PRE deployment verified: $PRE_URL"
