spring.profiles.active=test

# Tests use an isolated in-memory database; never connect to PRE or local MySQL.
spring.datasource.url=jdbc:h2:mem:aelb_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

aelb.email.app-env=local
aelb.email.provider=smtp
aelb.email.worker-enabled=false
aelb.jwt.secret=test-only-secret-with-at-least-32-bytes
aelb.jwt.expiration-ms=900000
aelb.jwt.refresh-expiration-ms=2592000000
aelb.cors.allowed-origins=http://localhost:3000
