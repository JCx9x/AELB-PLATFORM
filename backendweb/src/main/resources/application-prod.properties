# Production email defaults. Secrets/URLs must be injected by the runtime.
aelb.email.app-env=prod
aelb.email.provider=ses
aelb.email.worker-enabled=${EMAIL_WORKER_ENABLED:true}
aelb.email.max-per-second=${EMAIL_MAX_PER_SECOND:2}
aelb.email.worker-concurrency=${EMAIL_WORKER_CONCURRENCY:1}
aelb.email.batch-size=${EMAIL_BATCH_SIZE:10}
aelb.email.max-retries=${EMAIL_MAX_RETRIES:5}
aelb.email.ses-region=${EMAIL_SES_REGION:${AWS_REGION:eu-south-1}}
aelb.email.from=${EMAIL_FROM:}
aelb.email.from-name=${EMAIL_FROM_NAME:AELB}
aelb.email.frontend-public-url=${FRONTEND_PUBLIC_URL:}
aelb.email.token-encryption-key=${EMAIL_TOKEN_ENCRYPTION_KEY:}
server.error.include-message=never
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
