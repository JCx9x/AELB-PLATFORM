spring.application.name=backendweb

# --- DataSource ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:aelb_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:aelb_user}
spring.datasource.password=${DB_PASSWORD:change_me_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- JWT ---
# JWT_SECRET is mandatory. The application refuses to start when it is absent,
# known-insecure or shorter than 256 bits.
aelb.jwt.secret=${JWT_SECRET:}
# Short-lived access token (default 15 min). A blocked user or one whose role
# changes loses access within this window at most, since JwtAuthenticationFilter
# also re-checks the live DB state on every request.
aelb.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
# Rotating refresh token (default 30 days). Rotated on every use; reuse of an
# already-rotated token revokes every session for that user.
aelb.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}

# Browser JWT cookie. AUTH_COOKIE_SECURE must be true behind HTTPS in production.
aelb.auth.cookie.name=aelb_access
aelb.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
aelb.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Strict}

# --- CORS ---
aelb.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# --- Storage (S3 / MinIO) ---
aelb.storage.bucket=${STORAGE_BUCKET:aelb-images}
aelb.storage.region=${STORAGE_REGION:us-east-1}
aelb.storage.access-key=${STORAGE_ACCESS_KEY:minioadmin}
aelb.storage.secret-key=${STORAGE_SECRET_KEY:minioadmin}
aelb.storage.endpoint-override=${STORAGE_ENDPOINT_OVERRIDE:http://localhost:9000}
aelb.storage.public-endpoint=${STORAGE_PUBLIC_ENDPOINT:http://localhost:9000}
aelb.storage.presign-upload-minutes=${STORAGE_PRESIGN_UPLOAD_MINUTES:15}
aelb.storage.presign-read-minutes=${STORAGE_PRESIGN_READ_MINUTES:1440}

# --- Stripe ---
# Secret keys stay only in backend environment variables; never expose them as NEXT_PUBLIC_*.
aelb.stripe.secret-key=${STRIPE_SECRET_KEY:}
aelb.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
aelb.stripe.currency=${STRIPE_CURRENCY:eur}
aelb.stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:3000/perfil?stripe=success&session_id={CHECKOUT_SESSION_ID}}
aelb.stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:3000/perfil?stripe=cancelled}

# --- Servidor ---
server.port=8080
server.error.include-message=on-param
