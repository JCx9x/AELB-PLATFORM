spring.application.name=backendweb
spring.profiles.default=local

# --- DataSource ---
# VERIFY_IDENTITY requires TLS and validates both the server certificate and hostname.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:aelb_db}?sslMode=VERIFY_IDENTITY&serverTimezone=UTC
spring.datasource.username=${DB_USER:aelb_user}
spring.datasource.password=${DB_PASSWORD:change_me_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- JWT ---
# JWT_SECRET is mandatory. The application refuses to start when it is absent,
# known-insecure or shorter than 256 bits.
aelb.jwt.secret=${JWT_SECRET:}
# Short-lived access token (default 15 min). A blocked user or one whose role
# changes loses access within this window at most, since JwtAuthenticationFilter
# also re-checks the live DB state on every request.
aelb.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
# Rotating refresh token (default 30 days). Rotated on every use; reuse of an
# already-rotated token revokes every session for that user.
aelb.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}

# Browser JWT cookie. AUTH_COOKIE_SECURE must be true behind HTTPS in production.
aelb.auth.cookie.name=aelb_access
aelb.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
aelb.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Strict}

# --- CORS ---
aelb.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# --- Storage (S3 / MinIO) ---
aelb.storage.bucket=${STORAGE_BUCKET:aelb-images}
aelb.storage.region=${STORAGE_REGION:us-east-1}
aelb.storage.access-key=${STORAGE_ACCESS_KEY:}
aelb.storage.secret-key=${STORAGE_SECRET_KEY:}
aelb.storage.use-iam-role=${STORAGE_USE_IAM:true}
aelb.storage.endpoint-override=${STORAGE_ENDPOINT_OVERRIDE:}
aelb.storage.public-endpoint=${STORAGE_PUBLIC_ENDPOINT:}
aelb.storage.presign-upload-minutes=${STORAGE_PRESIGN_UPLOAD_MINUTES:15}
aelb.storage.presign-read-minutes=${STORAGE_PRESIGN_READ_MINUTES:1440}

# --- Stripe ---
# Secret keys stay only in backend environment variables; never expose them as NEXT_PUBLIC_*.
aelb.stripe.secret-key=${STRIPE_SECRET_KEY:}
aelb.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
aelb.stripe.currency=${STRIPE_CURRENCY:eur}
aelb.stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:3000/perfil?stripe=success&session_id={CHECKOUT_SESSION_ID}}
aelb.stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:3000/perfil?stripe=cancelled}
aelb.stripe.connect-timeout-ms=${STRIPE_CONNECT_TIMEOUT_MS:3000}
aelb.stripe.request-timeout-ms=${STRIPE_REQUEST_TIMEOUT_MS:10000}
aelb.stripe.max-retries=${STRIPE_MAX_RETRIES:2}
aelb.stripe.retry-base-delay-ms=${STRIPE_RETRY_BASE_DELAY_MS:200}
aelb.stripe.circuit-breaker-failure-threshold=${STRIPE_CIRCUIT_BREAKER_FAILURE_THRESHOLD:5}
aelb.stripe.circuit-breaker-open-ms=${STRIPE_CIRCUIT_BREAKER_OPEN_MS:30000}

# --- Servidor ---
server.port=8080
server.error.include-message=on-param
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# --- Actuator / observability ---
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=false
management.metrics.tags.application=${spring.application.name}
# Keep production logs searchable by CloudWatch without logging request bodies.
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level service=${spring.application.name} correlationId=%X{correlationId:-} logger=%logger{36} - %msg%n

# --- Transactional email ---
aelb.email.provider=${EMAIL_PROVIDER:smtp}
aelb.email.app-env=${APP_ENV:local}
aelb.email.from=${EMAIL_FROM:noreply@localhost.test}
aelb.email.from-name=${EMAIL_FROM_NAME:AELB}
aelb.email.worker-enabled=${EMAIL_WORKER_ENABLED:true}
aelb.email.worker-delay-ms=${EMAIL_WORKER_DELAY_MS:100}
aelb.email.max-per-second=${EMAIL_MAX_PER_SECOND:10}
aelb.email.worker-concurrency=${EMAIL_WORKER_CONCURRENCY:1}
aelb.email.batch-size=${EMAIL_BATCH_SIZE:10}
aelb.email.max-retries=${EMAIL_MAX_RETRIES:5}
aelb.email.processing-timeout-minutes=${EMAIL_PROCESSING_TIMEOUT_MINUTES:10}
aelb.email.sent-retention-days=${EMAIL_SENT_RETENTION_DAYS:30}
aelb.email.frontend-public-url=${FRONTEND_PUBLIC_URL:http://localhost:3000}
aelb.email.aws-region=${AWS_REGION:eu-west-1}
aelb.email.smtp-host=${SMTP_HOST:localhost}
aelb.email.smtp-port=${SMTP_PORT:1025}
aelb.email.smtp-auth=${SMTP_AUTH:false}
aelb.email.smtp-tls=${SMTP_TLS:false}
aelb.email.password-reset-token-expiration-minutes=${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:30}
aelb.email.password-reset-cooldown-seconds=${PASSWORD_RESET_COOLDOWN_SECONDS:60}
aelb.email.password-reset-max-per-hour=${PASSWORD_RESET_MAX_PER_HOUR:5}
aelb.email.email-verification-token-expiration-hours=${EMAIL_VERIFICATION_TOKEN_EXPIRATION_HOURS:24}
aelb.email.email-verification-cooldown-seconds=${EMAIL_VERIFICATION_COOLDOWN_SECONDS:60}
aelb.email.email-verification-max-per-hour=${EMAIL_VERIFICATION_MAX_PER_HOUR:5}
# Base64(SHA-256 key) is not required: any strong environment secret is hashed to AES-256.
aelb.email.token-encryption-key=${EMAIL_TOKEN_ENCRYPTION_KEY:local-only-change-me}
aelb.storage.max-upload-bytes=${STORAGE_MAX_UPLOAD_BYTES:5242880}
