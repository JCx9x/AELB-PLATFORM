# Local Docker's generated MySQL certificate is not installed in the JVM truststore.
# Traffic remains encrypted; production uses the VERIFY_IDENTITY setting in the
# base application.properties instead.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:aelb_db}?sslMode=REQUIRED&serverTimezone=UTC
aelb.storage.access-key=${STORAGE_ACCESS_KEY:minioadmin}
aelb.storage.secret-key=${STORAGE_SECRET_KEY:minioadmin}
aelb.storage.use-iam-role=false
aelb.storage.endpoint-override=${STORAGE_ENDPOINT_OVERRIDE:http://localhost:9000}
aelb.storage.public-endpoint=${STORAGE_PUBLIC_ENDPOINT:http://localhost:9000}
aelb.email.provider=${EMAIL_PROVIDER:smtp}
aelb.email.app-env=${APP_ENV:local}
aelb.email.smtp-host=${SMTP_HOST:mailpit}
aelb.email.smtp-port=${SMTP_PORT:1025}
