# DEVELOPMENT ONLY. Never use this file for production deployments.
# Production uses docker-compose.prod.yml, which does not include MySQL,
# MinIO or Mailpit and forces the prod Spring profile.
version: "3.9"

networks:
  aelb-net:
    driver: bridge

volumes:
  mysql-data:
  minio-data:

services:

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: aelb-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - aelb-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025/livez"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------
  # MySQL 8
  # -----------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: aelb-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${MYSQL_DATABASE}
      MYSQL_USER:          ${MYSQL_USER}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - aelb-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # -----------------------------------------------------------
  # MinIO (S3-compatible object storage para desarrollo local)
  # -----------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: aelb-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required in .env}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - aelb-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: aelb-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing local/$$STORAGE_BUCKET;
        exit 0
      "
    environment:
      MINIO_ROOT_USER:  ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required in .env}
      STORAGE_BUCKET:   ${STORAGE_BUCKET:?STORAGE_BUCKET is required in .env}
    networks:
      - aelb-net

  # -----------------------------------------------------------
  # Backend - Spring Boot
  # -----------------------------------------------------------
  backend:
    build:
      context: ./backendweb
      dockerfile: Dockerfile
    container_name: aelb-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    environment:
      DB_HOST:        mysql
      DB_PORT:        ${DB_PORT:-3306}
      DB_NAME:        ${DB_NAME}
      DB_USER:        ${DB_USER}
      DB_PASSWORD:    ${DB_PASSWORD}
      # The local profile uses encrypted MySQL traffic. Production must not
      # activate this profile and must use VERIFY_IDENTITY.
      SPRING_PROFILES_ACTIVE: local
      JWT_SECRET:     ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Strict}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      STORAGE_BUCKET:        ${STORAGE_BUCKET:?STORAGE_BUCKET is required in .env}
      STORAGE_REGION:        ${STORAGE_REGION:-us-east-1}
      STORAGE_ACCESS_KEY:    ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required in .env}
      STORAGE_SECRET_KEY:    ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required in .env}
      STORAGE_USE_IAM:       false
      STORAGE_ENDPOINT_OVERRIDE: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT:   ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      STRIPE_SECRET_KEY:         ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET:     ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CURRENCY:           ${STRIPE_CURRENCY:-eur}
      STRIPE_SUCCESS_URL:        ${STRIPE_SUCCESS_URL:-http://localhost:3000/perfil?stripe=success&session_id={CHECKOUT_SESSION_ID}}
      STRIPE_CANCEL_URL:         ${STRIPE_CANCEL_URL:-http://localhost:3000/perfil?stripe=cancelled}
      APP_ENV:                   local
      EMAIL_PROVIDER:             smtp
      EMAIL_WORKER_ENABLED:       ${EMAIL_WORKER_ENABLED:-true}
      EMAIL_MAX_PER_SECOND:       ${EMAIL_MAX_PER_SECOND:-10}
      EMAIL_WORKER_CONCURRENCY:   ${EMAIL_WORKER_CONCURRENCY:-1}
      EMAIL_BATCH_SIZE:           ${EMAIL_BATCH_SIZE:-10}
      EMAIL_MAX_RETRIES:          ${EMAIL_MAX_RETRIES:-5}
      EMAIL_FROM:                 ${EMAIL_FROM:-noreply@localhost.test}
      EMAIL_FROM_NAME:            ${EMAIL_FROM_NAME:-AELB}
      SMTP_HOST:                  mailpit
      SMTP_PORT:                  1025
      FRONTEND_PUBLIC_URL:        ${FRONTEND_PUBLIC_URL:-http://localhost:3000}
      EMAIL_TOKEN_ENCRYPTION_KEY: ${EMAIL_TOKEN_ENCRYPTION_KEY:-local-only-change-me}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - aelb-net

  # -----------------------------------------------------------
  # Frontend - Next.js (rutas dinámicas en ejecución)
  # -----------------------------------------------------------
  frontend:
    build:
      context: ./aelb-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: aelb-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - aelb-net
