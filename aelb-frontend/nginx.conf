server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Next.js static assets — cache permanente (el hash cambia con cada build)
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — rutas profundas y recargas de página
    # $uri/index.html en vez de $uri/ evita 403 en directorios sin index (ej: /admin/)
    location / {
        try_files $uri $uri/index.html /index.html;
    }
}
